[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-relay-simulator"
version = "0.2.0"
description = "A simulated relay controlled over serial-over-TCP, with a host CLI."
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-html>=4"]

[project.scripts]
relay-host = "relay_host.cli:main"
relay-sim = "relay_sim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--html=reports/report.html --self-contained-html -p pytester"
